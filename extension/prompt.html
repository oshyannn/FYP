<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download confirmation</title>
<style>
  body{font-family:system-ui,"Segoe UI",sans-serif;background:#202124;color:#e8eaed;margin:0;padding:22px 24px}
  h1{font-size:18px;margin:0 0 6px}
  p{margin:6px 0;color:#bdc1c6;font-size:14px;line-height:1.45}
  .box{background:#111;border:1px solid #3c4043;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px;word-break:break-all}
  .box b{color:#e8eaed}
  .why{color:#fdd663}
  .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  button{font-size:14px;padding:9px 14px;border-radius:6px;border:1px solid #5f6368;background:transparent;color:#e8eaed;cursor:pointer}
  #block{background:#f1f3f4;color:#202124;border-color:#f1f3f4;font-weight:600}
  button:focus{outline:2px solid #8ab4f8}
</style>
</head>
<body>
  <h1 id="title">A page wants to download a program file</h1>
  <div class="box"><b id="file"></b><br><span id="from"></span></div>
  <p class="why" id="why"></p>
  <p id="trust"></p>
  <p>The file is being held and has not been saved yet. Only allow it if you expected it. No answer within 60 seconds counts as Block.</p>
  <div class="row">
    <button id="always">Always allow this site</button>
    <button id="allow">Allow once</button>
    <button id="block" autofocus>Block</button>
  </div>
<script src="prompt.js"></script>
</body>
</html>
