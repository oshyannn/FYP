<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checking site…</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#222;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  main{max-width:520px;padding:32px;text-align:center}
  .spin{width:36px;height:36px;border:4px solid #cfd8e6;border-top-color:#2b6cb0;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
  .url{word-break:break-all;font-family:monospace;background:#fff;border:1px solid #d5dce8;border-radius:6px;padding:8px;margin:12px 0}
  button{font-size:14px;padding:8px 14px;border-radius:6px;border:1px solid #b9c4d6;background:#fff;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="spin"></div>
  <h2>Checking this site before opening it…</h2>
  <div class="url" id="url"></div>
  <p id="msg">This is not a known trusted site, so it is being checked more carefully.</p>
  <button id="cancel">Cancel</button>
</main>
<script src="checking.js"></script>
</body>
</html>
