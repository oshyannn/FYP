<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download confirmation - SafeBrowse</title>
<link rel="stylesheet" href="pages/ui.css">
<style>
  body { padding: 0; align-items: stretch; background: #fff; }
  .card { max-width: none; border: 0; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; width: 100%; }
  .body { text-align: left; padding: 16px 20px 18px; }
  h1 { font-size: 15px; }
  .why-line { color: var(--warn); font-weight: 500; }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
  .row button { padding: 9px 12px; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg></div><div><b>SafeBrowse</b><small>BROWSE SAFE. STAY PROTECTED.</small></div></div>
  <div class="body">
    <h1 id="title">A page wants to download a program file</h1>
    <div class="url plain"><b id="file"></b><br><span id="from"></span></div>
    <p class="why-line" id="why"></p>
    <p id="trust"></p>
    <p>The file is being held and has not been saved yet. Only allow it if you expected it. No answer within 60 seconds counts as Block.</p>
    <div class="row">
      <button class="outline" id="always">Always allow this site</button>
      <button class="outline" id="allow">Allow once</button>
      <button class="primary" id="block" autofocus>Block</button>
    </div>
  </div>
</main>
<script src="prompt.js"></script>
</body>
</html>
