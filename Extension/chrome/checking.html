<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checking website - SafeBrowse</title>
<link rel="stylesheet" href="pages/ui.css">
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg></div><div><b>SafeBrowse</b><small>BROWSE SAFE. STAY PROTECTED.</small></div></div>
  <div class="body">
    <div class="badge neutral"><div class="spin"></div></div>
    <h1>Checking website...</h1>
    <div class="url plain" id="url"></div>
    <div class="progress"><i></i></div>
    <p id="msg">This is not a known trusted site, so it is being checked more carefully before it opens.</p>
    <div class="actions"><button class="outline" id="cancel">Cancel</button></div>
  </div>
</main>
<script src="checking.js"></script>
</body>
</html>
